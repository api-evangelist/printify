aid: printify
name: Printify
review:
  question: Does Printify expose a documented public WebSocket API?
  answer: false
  date: '2026-06-25'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    Printify's only asynchronous surface is outbound HTTP webhooks (the
    provider sends a POST to a merchant-supplied URL when a shop event
    occurs). Webhooks are modeled as REST resources in the OpenAPI document
    rather than as an AsyncAPI document. No SSE or WebSocket stream is
    documented, so no AsyncAPI artifact was created.
findings:
  summary: |
    Printify does not publish a documented public WebSocket API. The Printify
    platform exposes only a REST (HTTPS) API under https://api.printify.com/v1
    secured with a Bearer token (Personal Access Token or OAuth 2.0) and a
    required User-Agent header. Event delivery is handled with outbound HTTP
    webhooks: Printify sends a POST request with a JSON payload to a
    merchant-registered URL when product, order, and shop events occur. No
    realtime, bidirectional, or streaming WebSocket (ws:// or wss://) endpoint
    is documented for any resource.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.printify.com/v1
      documented: true
    - protocol: Webhook
      scheme: https
      note: Outbound HTTP POST callbacks to a merchant-supplied URL on shop events. One-way provider-to-merchant HTTP, not WebSocket.
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in Printify's API reference as of the review date.
