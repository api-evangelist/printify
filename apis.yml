  - url: collections/printify.postman_collection.json
    type: PostmanCollection
  - url: collections/printify.opencollection.json
    type: OpenCollection
  description: Lists, creates, modifies, and deletes webhooks that deliver instant POST
    notifications to a merchant's endpoint when product, order, and shop events occur.
