  name: Printify Shops API
  tags:
  - Shops
  - Stores
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.printify.com/#shops
  baseURL: https://api.printify.com/v1
  properties:
  - url: https://developers.printify.com/#shops
    type: Documentation
  - url: openapi/printify-openapi.yml
    type: OpenAPI
  - url: collections/printify.postman_collection.json
    type: PostmanCollection
  - url: collections/printify.opencollection.json
    type: OpenCollection
  description: Lists the stores connected to a Printify account and disconnects a shop
    from the account.
- aid: printify:printify-catalog-api
  name: Printify Catalog API
  tags:
  - Catalog
  - Blueprints
  - Print Providers
  - Variants
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.printify.com/#catalog
  baseURL: https://api.printify.com/v1
  properties:
  - url: https://developers.printify.com/#catalog
    type: Documentation
  - url: openapi/printify-openapi.yml
    type: OpenAPI
  - url: collections/printify.postman_collection.json
    type: PostmanCollection
  - url: collections/printify.opencollection.json
    type: OpenCollection
  description: Browses the Printify catalog of blueprints (base products), their print
    providers, product variants and variant options, and shipping information available
    for fulfillment.
- aid: printify:printify-products-api
  name: Printify Products API
  tags:
  - Products
  - Publishing
  - Merchandise
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.printify.com/#products
  baseURL: https://api.printify.com/v1
  properties:
  - url: https://developers.printify.com/#products
    type: Documentation
  - url: openapi/printify-openapi.yml
    type: OpenAPI
  - url: collections/printify.postman_collection.json
    type: PostmanCollection
  - url: collections/printify.opencollection.json
    type: OpenCollection
  description: Lists, creates, retrieves, updates, deletes, and publishes products in
    a shop, including publish status callbacks (succeeded, failed, unpublish) to keep
    a connected storefront in sync.
- aid: printify:printify-orders-api
  name: Printify Orders API
  tags:
  - Orders
