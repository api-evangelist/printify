aid: printify
url: https://raw.githubusercontent.com/api-evangelist/printify/refs/heads/main/apis.yml
name: Printify
kind: company
description: Printify is a print-on-demand marketplace connecting merchants with a global
  network of print providers. The Printify REST API lets applications manage a Printify
  shop on a merchant's behalf - browsing the catalog of blueprints and print providers,
  creating and publishing products, submitting and tracking orders, uploading artwork,
  and subscribing to webhooks.
