meters:
- name: product_base_cost
  description: Base manufacturing price of each ordered product, charged per order line item.
  unit: orders
  aggregation: sum
  dimensions:
  - account
  - shop
  - blueprint
  - print_provider
- name: shipping_cost
  description: Shipping charge per order, varying by destination, method, and provider.
  unit: orders
  aggregation: sum
  dimensions:
  - account
  - shop
  - shipping_method
- name: membership_fee
  description: Monthly Premium membership subscription fee, if subscribed.
  unit: months
  aggregation: sum
  dimensions:
  - account
- name: membership_discount
  description: Discount applied to product and fulfillment costs from Premium or Enterprise membership.
  unit: orders
  aggregation: sum
  dimensions:
  - account
  - shop
principles:
- name: Visibility
  description: Track per-order product and shipping costs via the Orders API; reconcile against storefront revenue.
- name: Allocation
  description: Tag orders by shop and external_id to map fulfillment cost to channel, brand, or campaign.
- name: Optimization
  description: Compare monthly order volume against the Premium membership fee to decide when the ~20% discount pays for itself; for high volume, negotiate Enterprise rates. Compare print providers per blueprint for lower base and shipping costs.
- name: Accountability
  description: Assign cost ownership per shop/channel and review fulfillment margin monthly.
