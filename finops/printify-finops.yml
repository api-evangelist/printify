description: >-
  FinOps view of Printify spend. Printify does not charge for API usage. Costs are
  driven by per-order product base prices plus shipping, paid only when a customer
  orders, and by optional monthly membership fees (Premium) or a negotiated
  Enterprise contract. Premium and Enterprise memberships discount product and
  fulfillment costs, so the optimization lever is membership tier vs. order volume.
notes: >-
  Per-product base prices vary by blueprint and print provider; verify membership
  pricing and discount rates against the Printify pricing page during reconciliation.
sources:
- https://printify.com/pricing/
- https://developers.printify.com/
- https://focus.finops.org/focus-specification/v1-3/
